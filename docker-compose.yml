services:
  redis:
    image: redis:7-alpine
    container_name: doc-scanner-redis
    restart: always
    networks:
      - internal

  doc-scanner-cv:
    build: .
    container_name: doc-scanner-cv
    restart: unless-stopped
    working_dir: /app/backend
    command: ["python", "-m", "gunicorn", "-w", "4", "-b", "0.0.0.0:5000", "app:create_app()"]
    environment:
      # Read from the host .env (compose substitutes ${...}). Required for OCR
      # cleanup; if unset the app simply skips cleanup and returns raw text.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - scans-db:/app/backend/instance   # Persists scans.db outside the container
      - shared-uploads:/app/backend/storage
    ports:
      # Localhost only: Docker-published ports bypass the VPS firewall, and 0.0.0.0
      # exposed the app on the server's real IP (skipping Cloudflare). The tunnel
      # reaches the app over the internal network (http://doc-scanner-cv:5000).
      - "127.0.0.1:5000:5000"
    depends_on:
      - redis
    networks:
      - internal

  worker:
    build: .
    container_name: doc-scanner-worker
    restart: unless-stopped
    working_dir: /app/backend
    # --concurrency matches MAX_CONCURRENT_SCANS (backend/tasks.py): no point
    # keeping idle worker child processes the application-level gate in
    # api/documents.py will never actually dispatch a 4th scan to.
    command: celery -A tasks.celery_app worker -l info --concurrency=3 --max-memory-per-child=2000000 --max-tasks-per-child=10
    environment:
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - scans-db:/app/backend/instance
      - shared-uploads:/app/backend/storage
    depends_on:
      - redis
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-doc-scanner-cv
    profiles: ["prod"]
    restart: unless-stopped
    # Fixed metrics address so the healthcheck can ask cloudflared whether the tunnel is
    # connected to Cloudflare (`tunnel ready`), not just whether the process is running.
    command: tunnel --no-autoupdate --protocol http2 --metrics localhost:20241 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - doc-scanner-cv
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  shared-uploads:
  scans-db:
